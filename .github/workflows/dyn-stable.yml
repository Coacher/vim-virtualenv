name: Test dynamic stable ABI virtual environment activation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        tool: [ "venv", "virtualenv" ]
        kind: [ "internal", "external" ]
        system-python: [ "3.14", "3.12" ]
        venv-python: [ "3.14", "3.12" ]

    steps:
      - name: Set up tools
        run: |
          dnf install -y git python3.12 python3.14 python3-virtualenv

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        run: |
          export VIM_VIRTUALENV_PYTHON_BIN="${RUNNER_TEMP}/python-bin"
          mkdir -p "${VIM_VIRTUALENV_PYTHON_BIN}"
          ln -s "$(command -v python${{ matrix.system-python }})" "${VIM_VIRTUALENV_PYTHON_BIN}/python"
          ln -s "$(command -v python${{ matrix.system-python }})" "${VIM_VIRTUALENV_PYTHON_BIN}/python3"
          echo "${VIM_VIRTUALENV_PYTHON_BIN}" >> "${GITHUB_PATH}"

      - name: Set up editor
        run: |
          dnf install -y vim-enhanced
          vim --version | grep -F '+python3/dyn-stable'

      - name: Create virtual environment
        run: |
          export VIM_VIRTUALENV_TARGET="$(mktemp --directory)"
          if [[ "${{ matrix.tool }}" == "venv" ]]; then
            python${{ matrix.venv-python }} -m venv --without-pip "${VIM_VIRTUALENV_TARGET}"
          else
            /usr/bin/python -m virtualenv --no-seed --python ${{ matrix.venv-python }} "${VIM_VIRTUALENV_TARGET}"
          fi
          echo "VIM_VIRTUALENV_TARGET=${VIM_VIRTUALENV_TARGET}" >> "${GITHUB_ENV}"

      - name: Activate virtual environment
        run: |
          python --version
          if [[ "${{ matrix.kind }}" == "internal" ]];
            then cd "${VIM_VIRTUALENV_TARGET}"
            else source "${VIM_VIRTUALENV_TARGET}/bin/activate"
          fi
          MATRIX_KIND_CODE=$([[ "${{ matrix.kind }}" == "internal" ]] && echo 1 || echo 0)
          vim --not-a-term --clean -u "${GITHUB_WORKSPACE}/.github/workflows/minimal.vim" \
            -c "call assert_equal('${{ matrix.tool }}', virtualenv#state('virtualenv_type'))" \
            -c "call assert_equal(${MATRIX_KIND_CODE}, virtualenv#state('virtualenv_internal'))" \
            -c "call assert_equal('${VIM_VIRTUALENV_TARGET}', virtualenv#state('virtualenv_directory'))" \
            -c "call assert_equal('${VIM_VIRTUALENV_TARGET}', py3eval('sys.prefix'))" \
            -c "call assert_equal('${{ matrix.venv-python }}', virtualenv#state('virtualenv_python'))" \
            -c "call assert_equal('${{ matrix.venv-python }}', join(py3eval('sys.version_info[:2]'), '.'))" \
            -c "call g:ExitTest()"
